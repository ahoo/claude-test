<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>damru 控制台 · 危险操作确认</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#176b5b}a:hover{color:#0d4f43}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:6px;border:1px solid #c9d1c6;background:#ffffff;color:#151815;font-size:14px;font-weight:700;text-decoration:none;box-sizing:border-box;cursor:pointer;white-space:nowrap;font-family:inherit}
.btn:hover{background:#f0f3ef;color:#151815}
.btn-danger{background:#b42318;border-color:#b42318;color:#ffffff}
.btn-danger:hover{background:#8f1c13;color:#ffffff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.input{min-height:44px;padding:10px 12px;border:1px solid #c9d1c6;border-radius:6px;background:#ffffff;font-size:14px;color:#151815;box-sizing:border-box;width:100%}
.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
</style>
</helmet>
<div style="width: 560px; height: 480px; box-sizing: border-box; padding: 24px; background: #3a4138; display: flex; align-items: center; justify-content: center; color: #151815; font-family: Aptos, 'Segoe UI', system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 15px; line-height: 1.5">
  <div role="dialog" aria-modal="true" aria-labelledby="dlg-title" style="width: 100%; box-sizing: border-box; padding: 24px; border-radius: 10px; background: #ffffff; box-shadow: 0 24px 60px rgb(0 0 0 / 0.3); display: flex; flex-direction: column; gap: 14px">
    <h2 id="dlg-title" style="margin: 0; font-size: 20px; font-weight: 800">重启容器 damru-worker-0？</h2>
    <ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 14px">
      <li>正在运行的任务 T-0413 会被取消，排队的 2 个任务保留</li>
      <li>warm 会话关闭，下一个任务冷启动，约 34 秒</li>
      <li>容器 IP 可能变化：watch 会重新应用代理规则，期间由 kill switch 拦截出网</li>
    </ul>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="confirm-name" style="font-size: 13px; font-weight: 700">输入 <span class="mono">damru-worker-0</span> 以确认</label>
      <input id="confirm-name" class="input mono" value="{{typed}}" onChange="{{onType}}" autocomplete="off" spellcheck="false">
    </div>
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px">
      <span style="font-size: 13px; color: #5f685d">需要管理员 · 会写入审计日志</span>
      <div style="display: flex; gap: 8px">
        <a class="btn" href="Worker.dc.html">取消</a>
        <button type="button" class="btn btn-danger" disabled="{{locked}}">重启容器</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":480}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { typed: '' };
  }
  renderVals() {
    return {
      typed: this.state.typed,
      onType: (e) => this.setState({ typed: e.target.value }),
      locked: this.state.typed.trim() !== 'damru-worker-0'
    };
  }
}
</script>
</body>
</html>
