<script>
(function(){
var q=function(i){return document.getElementById(i)},M=Math,PI=M.PI,sd=11,LT=String.fromCharCode(60);
function rnd(){sd=(sd*9301+49297)%233280;return sd/233280}
function f(n){return n.toFixed(1)}
function tile(id,s){q(id).innerHTML=LT+'g>'+s+LT+'/g>'+LT+'g transform="translate(680,0)">'+s+LT+'/g>'}
function tuft(x,y,k,c){return LT+'path fill="'+c+'" d="M'+f(x)+' '+f(y)+' l'+f(-3*k)+' '+f(-8*k)+' l'+f(3*k)+' '+f(4*k)+' l'+f(1*k)+' '+f(-10*k)+' l'+f(2*k)+' '+f(9*k)+' l'+f(3*k)+' '+f(-6*k)+' l'+f(-1*k)+' '+f(7*k)+' Z"/>'}
function flower(x,y,c){return LT+'path d="M'+f(x)+' '+f(y)+' v-9" stroke="#3F9A4A" stroke-width="1.5"/>'+LT+'circle cx="'+f(x)+'" cy="'+f(y-10)+'" r="3.5" fill="'+c+'"/>'+LT+'circle cx="'+f(x)+'" cy="'+f(y-10)+'" r="1.3" fill="#FFDD77"/>'}
var i,s='',a,cols=['#fff','#F28B9B','#B48CE0','#FFCB47'];
for(i=0;14>i;i++){a=i*PI/7;s+=LT+'line x1="'+f(8*M.cos(a+0.3))+'" y1="'+f(8*M.sin(a+0.3))+'" x2="'+f(46*M.cos(a))+'" y2="'+f(46*M.sin(a))+'"/>'}
var sps=document.querySelectorAll('.sp');sps[0].innerHTML=s;sps[1].innerHTML=s;
s=LT+'rect x="0" y="342" width="680" height="3" fill="#D9B77E"/>'+LT+'rect x="0" y="351" width="680" height="3" fill="#D9B77E"/>';
for(i=0;17>i;i++)s+=LT+'rect x="'+(i*40+8)+'" y="336" width="6" height="25" rx="1" fill="#C9A56B" stroke="#8A5A3B" stroke-width="1"/>';
tile('fence',s);
s='';for(i=0;46>i;i++)s+=tuft(rnd()*680,360+rnd()*4,0.7+rnd()*0.4,rnd()>0.5?'#6FB552':'#84C660');
for(i=0;9>i;i++)s+=flower(rnd()*680,361,cols[i%4]);
tile('verge',s);
s='';for(i=0;34>i;i++){a=rnd();s+=LT+'ellipse cx="'+f(rnd()*680)+'" cy="'+f(368+rnd()*54)+'" rx="'+f(1.5+a*3)+'" ry="'+f(1+a*1.2)+'" fill="'+(rnd()>0.5?'#63676E':'#7D8188')+'"/>'}
tile('peb',s);
s='';for(i=0;60>i;i++)s+=tuft(rnd()*680,438+rnd()*24,1.1+rnd()*0.8,rnd()>0.5?'#5FA647':'#92CF6E');
for(i=0;8>i;i++)s+=flower(rnd()*680,446+rnd()*10,cols[(i+1)%4]);
tile('front',s);
var BB=[325,330],R=25,L=68,V=180;
function ik(th,bob){
var H=[310,226+bob],P=[BB[0]+R*M.cos(th),BB[1]+R*M.sin(th)],A=[P[0]-2,P[1]-13];
var dx=A[0]-H[0],dy=A[1]-H[1],d=M.sqrt(dx*dx+dy*dy),b=M.atan2(dy,dx),al=M.acos(M.min(1,d/(2*L)));
return{H:H,K:[H[0]+L*M.cos(b-al),H[1]+L*M.sin(b-al)],A:A,P:P}
}
function leg(p,th,bob){
var g=ik(th,bob),d='M'+f(g.H[0])+' '+f(g.H[1])+' L'+f(g.K[0])+' '+f(g.K[1])+' L'+f(g.A[0])+' '+f(g.A[1]);
q(p+'LegO').setAttribute('d',d);q(p+'Leg').setAttribute('d',d);
if(p=='n')q('nLegH').setAttribute('d','M'+f(g.H[0]+8)+' '+f(g.H[1]-5)+' L'+f(g.K[0]-4)+' '+f(g.K[1]-7));
q(p+'Foot').setAttribute('transform','translate('+f(g.A[0])+','+f(g.A[1])+') rotate('+f(8*M.sin(th))+')');
var c=q(p+'Crank');c.setAttribute('x2',f(g.P[0]));c.setAttribute('y2',f(g.P[1]));
q(p+'Pedal').setAttribute('transform','translate('+f(g.P[0])+','+f(g.P[1])+')');
}
function tail(t){
var N=18,T=[],B=[],C=[],i,u,x,y,w,k,d,dy='',ds='',dc='';
for(i=0;N>=i;i++){u=i/N;x=306-u*196;y=216-34*M.pow(u,1.7)+M.sin(t*4.2-u*4.5)*u*11;w=25*M.pow(1-u,0.75)+1.2;T.push([x,y-w]);B.push([x,y+w]);C.push([x,y+w*0.4]);
if(i>1){if(N-1>i){k=7*(1-u*0.6);dc+='M'+f(x+5.5)+' '+f(y-w+0.5)+' L'+f(x-1)+' '+f(y-w-k)+' L'+f(x-5.5)+' '+f(y-w+0.5)+' Z '}
if(N-2>i){if(i%2==0)ds+='M'+f(x)+' '+f(y-w+4)+' L'+f(x-3)+' '+f(y-w*0.05)+' '}}}
d='M'+f(T[0][0])+' '+f(T[0][1]);for(i=1;N>=i;i++)d+=' L'+f(T[i][0])+' '+f(T[i][1]);for(i=N;i>=0;i--)d+=' L'+f(B[i][0])+' '+f(B[i][1]);d+=' Z';
dy='M'+f(C[0][0])+' '+f(C[0][1]);for(i=1;N>=i;i++)dy+=' L'+f(C[i][0])+' '+f(C[i][1]);for(i=N;i>=0;i--)dy+=' L'+f(B[i][0])+' '+f(B[i][1]);dy+=' Z';
q('tlB').setAttribute('d',d);q('tlO').setAttribute('d',d);q('tlY').setAttribute('d',dy);q('tlS').setAttribute('d',ds);q('tlC').setAttribute('d',dc);
}
function ribbon(id,t,oy,ph,len){
var n=9,T=[],B=[],i,u,x,y,d;
for(i=0;n>=i;i++){u=i/n;x=386-u*len;y=160+oy-u*12+M.sin(t*11-u*5+ph)*u*8;T.push([x,y-5.5]);B.push([x,y+5.5])}
d='M'+f(T[0][0])+' '+f(T[0][1]);for(i=1;n>=i;i++)d+=' L'+f(T[i][0])+' '+f(T[i][1]);d+=' L'+f(T[n][0]+7)+' '+f((T[n][1]+B[n][1])/2);for(i=n;i>=0;i--)d+=' L'+f(B[i][0])+' '+f(B[i][1]);
q(id).setAttribute('d',d+' Z');
}
function tx(id,x){q(id).setAttribute('transform','translate('+f(x)+',0)')}
var dust=q('dust').children,nd=dust.length;
function frame(ms){
var t=ms/1000,th=t*4.4,bob=M.sin(th*2)*1.3,wd=((t*V/60)*180/PI)%360,i,p,e,bx,by,fl;
leg('n',th,bob);leg('f',th+PI,bob);
q('rwr').setAttribute('transform','rotate('+f(wd)+')');q('fwr').setAttribute('transform','rotate('+f(wd)+')');
q('ring').setAttribute('transform','rotate('+f((th*180/PI)%360)+' 325 330)');
q('chT').setAttribute('stroke-dashoffset',f(-((th*16)%5)));q('chB').setAttribute('stroke-dashoffset',f((th*16)%5));
q('upper').setAttribute('transform','translate(0,'+bob.toFixed(2)+')');
q('head').setAttribute('transform','rotate('+(M.sin(th*2+0.6)*1.4).toFixed(2)+' 392 162)');
q('jaw').setAttribute('transform','rotate('+(4+M.sin(t*5)*3).toFixed(2)+' 402 160)');
q('lid').setAttribute('opacity',0.14>(t%3.8)?1:0);
tail(t);ribbon('sf0',t,0,0,54);ribbon('sf1',t,7,1.3,44);
q('bask').setAttribute('transform','translate(0,'+(M.sin(th*2+1)*1).toFixed(2)+')');
q('flw').setAttribute('transform','rotate('+(-6+M.sin(t*6)*4).toFixed(2)+' 458 216)');
q('rays').setAttribute('transform','rotate('+f((t*10)%360)+' 590 72)');
tx('dash',-((t*V)%80));tx('peb',-((t*V)%680));tx('verge',-((t*V)%680));tx('front',-((t*V*1.25)%680));tx('fence',-((t*V*0.9)%680));tx('trees',-((t*V*0.45)%680));tx('hn',-((t*V*0.2)%680));tx('hf',-((t*V*0.1)%680));tx('mts',-((t*V*0.04)%680));tx('clouds',-((t*V*0.025)%680));
for(i=0;3>i;i++){bx=700-((t*14+i*230)%760);by=70+i*34+M.sin(t*0.8+i)*6;fl=M.sin(t*9+i*2)*6;q('b'+i).setAttribute('d','M'+f(bx-11)+' '+f(by+fl)+' Q'+f(bx-5)+' '+f(by-5)+' '+f(bx)+' '+f(by)+' Q'+f(bx+5)+' '+f(by-5)+' '+f(bx+11)+' '+f(by+fl))}
for(i=0;nd>i;i++){p=(t*1.3+i/nd)%1;e=dust[i];e.setAttribute('cx',f(196-p*84));e.setAttribute('cy',f(385-p*18-M.sin(p*PI)*4));e.setAttribute('r',f(3+p*10));e.setAttribute('opacity',(0.6*(1-p)).toFixed(2))}
for(i=0;3>i;i++){p=(t*1.5+i*0.37)%1;e=q('w'+i);e.setAttribute('transform','translate('+f(130-p*220)+',0)');e.setAttribute('opacity',(M.sin(p*PI)*0.85).toFixed(2))}
}
var still=false;
if(window.matchMedia){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)still=true}
if(still){frame(500);return}
function loop(ms){frame(ms||0);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
</script>
