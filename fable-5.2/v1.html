<script>
(function(){
var $=function(i){return document.getElementById(i)};
var BB=[320,320],R=24,L=66,V=170;
function ik(th,bob){
var H=[308,222+bob],P=[BB[0]+R*Math.cos(th),BB[1]+R*Math.sin(th)],A=[P[0],P[1]-8];
var dx=A[0]-H[0],dy=A[1]-H[1],d=Math.hypot(dx,dy),b=Math.atan2(dy,dx),a=Math.acos(Math.min(1,d/(2*L)));
return{H:H,K:[H[0]+L*Math.cos(b-a),H[1]+L*Math.sin(b-a)],A:A,P:P};
}
function setLeg(p,th,bob){
var g=ik(th,bob);
$(p+'Thigh').setAttribute('d','M'+g.H[0]+' '+g.H[1]+' L'+g.K[0].toFixed(1)+' '+g.K[1].toFixed(1));
$(p+'Shin').setAttribute('d','M'+g.K[0].toFixed(1)+' '+g.K[1].toFixed(1)+' L'+g.A[0].toFixed(1)+' '+g.A[1].toFixed(1));
var f=$(p+'Foot');f.setAttribute('cx',(g.A[0]+5).toFixed(1));f.setAttribute('cy',(g.A[1]+3).toFixed(1));
var c=$(p+'Crank');c.setAttribute('x2',g.P[0].toFixed(1));c.setAttribute('y2',g.P[1].toFixed(1));
$(p+'Pedal').setAttribute('x',(g.P[0]-10).toFixed(1));$(p+'Pedal').setAttribute('y',(g.P[1]-2.5).toFixed(1));
}
function tx(id,x){$(id).setAttribute('transform','translate('+x.toFixed(1)+',0)')}
function frame(t){
var s=t/1000,th=s*4.2,bob=Math.sin(th*2)*1.2,wd=(s*V/55)*180/Math.PI;
setLeg('n',th,bob);setLeg('f',th+Math.PI,bob);
$('rSpokes').setAttribute('transform','rotate('+(wd%360).toFixed(1)+' 230 320)');
$('fSpokes').setAttribute('transform','rotate('+(wd%360).toFixed(1)+' 430 320)');
$('upper').setAttribute('transform','translate(0,'+bob.toFixed(2)+')');
$('armG').setAttribute('transform','translate(0,'+(bob*0.5).toFixed(2)+')');
$('tail').setAttribute('transform','rotate('+(Math.sin(s*3.2)*5).toFixed(2)+' 304 212)');
$('scarfTail').setAttribute('transform','rotate('+(Math.sin(s*10)*9).toFixed(2)+' 388 164)');
$('jaw').setAttribute('transform','rotate('+(3+Math.sin(s*5)*2.5).toFixed(2)+' 404 160)');
$('lid').setAttribute('ry',(s%3.6)<0.14?10:0);
$('rays').setAttribute('transform','rotate('+((s*12)%360).toFixed(1)+' 580 80)');
tx('dashes',-((s*V)%80));tx('bushes',-((s*V*0.45)%680));tx('hillsNear',-((s*V*0.2)%680));tx('hillsFar',-((s*V*0.1)%680));tx('clouds',-((s*V*0.04)%680));
['w1','w2','w3'].forEach(function(id,i){var p=((s*1.6+i*0.37)%1);$(id).setAttribute('transform','translate('+(120-p*200).toFixed(1)+',0)');$(id).setAttribute('opacity',(Math.sin(p*Math.PI)).toFixed(2));});
}
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduce){frame(400);return;}
function loop(t){frame(t);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
</script>
